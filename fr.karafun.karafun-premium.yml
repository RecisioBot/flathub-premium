id: fr.karafun.karafun-premium
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: karafun
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: karafun
    buildsystem: simple
    build-commands:
      - cp -a main /app/main
      - install -Dm755 karafun.sh /app/bin/karafun
      - install -Dm644 fr.karafun.karafun-premium.desktop -t /app/share/applications
      - install -Dm644 fr.karafun.karafun-premium.metainfo.xml -t /app/share/metainfo
      - install -Dm644 karafun-128.png /app/share/icons/hicolor/128x128/apps/fr.karafun.karafun-premium.png
      - install -Dm644 karafun-256.png /app/share/icons/hicolor/256x256/apps/fr.karafun.karafun-premium.png
      - install -Dm644 karafun-512.png /app/share/icons/hicolor/512x512/apps/fr.karafun.karafun-premium.png
    sources:
      - type: archive
        url: https://s3.billos.fr/karafun-desktop/KaraFun-linux-x64-3.13.0.zip
        sha256: 90d40a50e2a0e1f2263f55c398f8ebd1c35c3ab33f2be7d0543a0e68b14066ae
        dest: main
        only-arches: [x86_64]
      - type: script
        dest-filename: karafun.sh
        commands:
          - exec zypak-wrapper /app/main/KaraFun "$@"
      - type: file
        path: fr.karafun.karafun-premium.desktop
      - type: file
        path: fr.karafun.karafun-premium.metainfo.xml
      - type: file
        path: karafun-128.png
      - type: file
        path: karafun-256.png
      - type: file
        path: karafun-512.png
