id: com.recisio.karafun-premium
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: karafun
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
modules:
  - name: karafun
    buildsystem: simple
    build-commands:
      - cp -a main /app/main
      - install -Dm755 karafun.sh /app/bin/karafun
      - install -Dm644 com.recisio.karafun-premium.desktop -t /app/share/applications
      - install -Dm644 com.recisio.karafun-premium.metainfo.xml -t /app/share/metainfo
      - install -Dm644 main/resources/karafun-128.png /app/share/icons/hicolor/128x128/apps/com.recisio.karafun-premium.png
      - install -Dm644 main/resources/karafun-256.png /app/share/icons/hicolor/256x256/apps/com.recisio.karafun-premium.png
      - install -Dm644 main/resources/karafun-512.png /app/share/icons/hicolor/512x512/apps/com.recisio.karafun-premium.png
    sources:
      - type: archive
        url: https://s3.billos.fr/karafun-desktop/KaraFun-linux-x64-3.13.0.zip
        sha256: 6bb8e8f6c98a372d5111e8eb09f1821ec27666d9b9e9d9c6b15d37702893cf0e
        dest: main
        only-arches: [x86_64]
      - type: script
        dest-filename: karafun.sh
        commands:
          - exec zypak-wrapper /app/main/KaraFun "$@"
      - type: file
        path: com.recisio.karafun-premium.desktop
      - type: file
        path: com.recisio.karafun-premium.metainfo.xml
